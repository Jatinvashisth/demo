name: Docker Compose CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./   # root folder, change if your docker-compose.yml is in a subfolder

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: List repo files
        run: ls -R  # debug to ensure docker-compose.yml is visible

      - name: Start services with docker-compose
        run: |
          docker-compose up -d --build

      - name: Wait for FastAPI to start
        run: |
          echo "Waiting for FastAPI to start..."
          sleep 10
          curl -f http://localhost:8000/ || echo "FastAPI not ready yet"

      - name: List running containers
        run: docker ps

      - name: Stop services
        run: docker-compose down

