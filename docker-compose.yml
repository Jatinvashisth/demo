services:
  mysql_db:
    image: mysql:8               # Docker Hub se pull
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: college
    volumes:
      - college_db_data:/var/lib/mysql
    networks:
      - fastnet

  fastapi_app:
    build: .                     # current folder me Dockerfile se build
    container_name: fastapi_app
    ports:
      - "8000:8000"
    networks:
      - fastnet
    depends_on:
      - mysql_db

volumes:
  college_db_data:

networks:
  fastnet:
    external: true
